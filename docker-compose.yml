services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: taskeen-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: taskeen-backend
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__TaskeenDb: "Server=db,1433;Database=TaskeenDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
    ports:
      - "5213:5213"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: taskeen-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mssql_data:
